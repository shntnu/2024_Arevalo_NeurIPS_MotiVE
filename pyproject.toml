# Single source of truth, managed by pixi (no uv). Mirrors the nahual
# pixi pattern: one workspace, two platform features gated by environment.
#   GPU servers (Linux+CUDA, the default):  pixi run snakemake -s train.smk ...
#   macOS (Apple Silicon, MPS):             pixi run -e osx snakemake -s train.smk ...
[project]
name = "motive"
version = "0.2.0"
description = "A Drug-Target Interaction Graph For Inductive Link Prediction"
readme = "README.md"
requires-python = "==3.12.*"
# Runtime deps are managed by pixi below (conda-forge), not here.
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The repo's importable packages (top-level scripts run from the repo root).
packages = ["motive", "utils", "plot"]
py-modules = []

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

# Platform-agnostic deps. pytorch itself is platform-gated (features below);
# the PyG stack here resolves to CUDA builds in the gpu env (cuda
# system-requirement) and CPU/MPS builds in the osx env. pyg-lib is omitted:
# no Apple-Silicon build exists and it is optional - torch-sparse handles
# neighbor sampling on every platform.
[tool.pixi.dependencies]
python = "3.12.*"
# pandas 3.0 removed DataFrame.applymap, which PyComplexHeatmap 1.8.5 (latest)
# still uses in oncoPrintPlotter (the waterfall plot). The codebase targets the
# pandas 2.x era anyway, so cap below 3.
pandas = "<3"
pytorch_geometric = ">=2.6"
pytorch_scatter = "*"
pytorch_sparse = "*"
pytorch_cluster = "*"
pytorch_spline_conv = "*"
snakemake-minimal = ">=8.27"
pyarrow = ">=19"
tensorboard = ">=2.18"
seaborn = ">=0.13.2"
scikit-learn = ">=1.6.1"
umap-learn = ">=0.5.7"
fastcluster = ">=1.2.6"
duckdb = "*"
awscli = "*"            # data download (aws s3 sync) + the snakemake fetch rule
setuptools = "<81"      # pkg_resources (removed in 81) - needed by the tensorboard CLI
pip = "*"

[tool.pixi.pypi-dependencies]
# Install the repo itself (editable) so motive/utils/plot import everywhere,
# matching the old `uv sync` behavior (needed by e.g. pytest tests/).
motive = { path = ".", editable = true }
# Not on conda-forge (or lab package); installed by pixi's PyPI layer.
copairs = ">=0.4.2,<0.5"   # 0.5 added a normalized_average_precision column the repo's AP step doesn't produce
torcheval = ">=0.0.7"
pycomplexheatmap = ">=1.8.1"

# Linux + CUDA: pytorch-gpu pulls the CUDA build; the cuda system-requirement
# makes the solver pick CUDA variants of the PyG extensions too.
[tool.pixi.feature.linux-gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }
[tool.pixi.feature.linux-gpu.dependencies]
pytorch-gpu = ">=2.5"

# macOS (Apple Silicon): plain pytorch ships MPS support.
[tool.pixi.feature.osx-mps]
platforms = ["osx-arm64"]
[tool.pixi.feature.osx-mps.dependencies]
pytorch = ">=2.5"
[tool.pixi.feature.osx-mps.activation.env]
# Let unimplemented MPS ops fall back to CPU instead of erroring.
PYTORCH_ENABLE_MPS_FALLBACK = "1"

# Dev tooling (formerly the uv [dependency-groups].dev) plus the test runner.
[tool.pixi.feature.dev.dependencies]
pytest = "*"
ipdb = "*"
python-lsp-server = "*"
python-lsp-ruff = "*"
rope = "*"
yapf = "*"
sqlparse = "*"
snakefmt = "*"

[tool.pixi.environments]
# default = Linux+CUDA (the canonical platform, like nahual). macOS users pick
# the osx env explicitly: pixi run -e osx ...
default = { features = ["linux-gpu", "dev"], solve-group = "linux" }
osx = { features = ["osx-mps", "dev"], solve-group = "osx" }

[tool.pixi.tasks]
test = "pytest tests/"
data = "snakemake -c1"
