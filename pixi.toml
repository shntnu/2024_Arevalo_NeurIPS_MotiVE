# macOS (Apple Silicon) environment for MOTIVE, mirroring the nahual_tutorial
# pattern: conda-forge ships prebuilt osx-arm64 PyTorch (with MPS) and the PyG
# compiled extensions, so we avoid the pyg-lib / CUDA pins that make the uv.lock
# Linux-only. The GPU servers (spirit/oppy/karkinos) keep using uv + the flake;
# this is the Mac-only alternative. pyg-lib is intentionally absent (no
# Apple-Silicon build exists); torch-sparse covers neighbor sampling instead.
[workspace]
name = "motive"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
pytorch = ">=2.5"
pytorch_geometric = ">=2.6.1"
pytorch_scatter = "*"
pytorch_sparse = "*"
pytorch_cluster = "*"
pytorch_spline_conv = "*"
snakemake-minimal = ">=8.27"
pyarrow = ">=19"
tensorboard = ">=2.18"
seaborn = ">=0.13.2"
scikit-learn = ">=1.6.1"
umap-learn = ">=0.5.7"
fastcluster = ">=1.2.6"
duckdb = "*"
pip = "*"

[pypi-dependencies]
copairs = ">=0.4.2"
torcheval = ">=0.0.7"
pycomplexheatmap = ">=1.8.1"

[activation.env]
# Let unimplemented MPS ops fall back to CPU instead of erroring.
PYTORCH_ENABLE_MPS_FALLBACK = "1"
